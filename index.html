<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Minimal Single Page with Carousel</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
 <header class="site-header">
  <div class="brand">
    <img src="img/SSitter_White_Background_Black.jpg" alt="Singing Sitter logo" class="logo" />
    <p class="slogan">Hyper local care in North Loop & Downtown MPLS, MN.</p>
  </div>

  <nav class="nav" aria-label="Primary navigation">
    <a href="#about">About Us</a>
    <a href="#services">Services</a>
    <a href="#service-area">Service Area</a>
    <a href="#faq">FAQ</a>
    <a href="#team">Team</a>
  </nav>

  <div class="auth-actions">
    <a class="btn btn-primary" href="/signup.html">Client Signup</a>
    <a class="btn btn-ghost" href="/login.html">Client Login</a>
  </div>
</header>


  <!-- Carousel -->
  <section class="carousel-section" aria-label="Featured images">
    <div class="carousel" id="carousel" role="region" aria-roledescription="carousel" aria-label="Image carousel">
      <div class="slides">
        <img src="images/slide1.jpg" alt="Description of slide 1" class="slide" />
        <img src="images/slide2.jpg" alt="Description of slide 2" class="slide" />
        <img src="images/slide3.jpg" alt="Description of slide 3" class="slide" />
      </div>

      <button class="nav-btn prev" aria-label="Previous slide">‹</button>
      <button class="nav-btn next" aria-label="Next slide">›</button>

      <div class="dots" role="tablist" aria-label="Slide selection"></div>
    </div>
  </section>

  <main>
    <section id="about" class="panel">
      <h1>About Us</h1>
      <p>Short intro text.</p>
    </section>

    <section id="services" class="panel">
      <h2>Services</h2>
      <p>Feature list or highlights.</p>
    </section>

    <section id="team" class="panel">
      <h2>Team</h2>
      <p>Contact details or form placeholder.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Laura Ford</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Minimal carousel logic
    (function(){
      const carousel = document.getElementById('carousel');
      const slidesWrap = carousel.querySelector('.slides');
      const slides = Array.from(carousel.querySelectorAll('.slide'));
      const prev = carousel.querySelector('.prev');
      const next = carousel.querySelector('.next');
      const dotsContainer = carousel.querySelector('.dots');
      let index = 0;

      // create dots
      slides.forEach((_, i) => {
        const btn = document.createElement('button');
        btn.className = 'dot';
        btn.setAttribute('aria-label', 'Go to slide ' + (i+1));
        btn.dataset.index = i;
        dotsContainer.appendChild(btn);
      });
      const dots = Array.from(dotsContainer.children);

      function update() {
        slidesWrap.style.transform = `translateX(${-index * 100}%)`;
        dots.forEach((d,i)=> d.classList.toggle('active', i===index));
      }

      prev.addEventListener('click', ()=> { index = (index - 1 + slides.length) % slides.length; update(); });
      next.addEventListener('click', ()=> { index = (index + 1) % slides.length; update(); });
      dots.forEach(d => d.addEventListener('click', e => { index = Number(e.currentTarget.dataset.index); update(); }));

      // keyboard support
      carousel.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') prev.click();
        if (e.key === 'ArrowRight') next.click();
      });

      // make carousel focusable
      carousel.tabIndex = 0;
      update();
    })();
  </script>
</body>
</html>
