
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Minimal Single Page</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <img src="logo.svg" alt="Logo" class="logo" />
      <p class="slogan">A short one‑sentence slogan goes here.</p>
    </div>
    <nav class="nav">
      <a href="#about">About</a>
      <a href="#features">Features</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="about" class="panel">
      <h1>About</h1>
      <p>Short intro text.</p>
    </section>

    <section id="features" class="panel">
      <h2>Features</h2>
      <p>Feature list or highlights.</p>
    </section>

    <section id="contact" class="panel">
      <h2>Contact</h2>
      <p>Contact details or form placeholder.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Your Name</p>
  </footer>

  <script>
    // small enhancement: set current year
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
